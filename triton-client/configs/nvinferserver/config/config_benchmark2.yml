# config_2.yml
# v12: Demux-based parallel inference pipeline


rest-server:
  within_multiurisrcbin: 1

server-app-ctx:
  httpIp: "0.0.0.0"
  httpPort: "9001"
  pipeline_width: 1920
  pipeline_height: 1080
  maxBatchSize: 1
  batched_push_timeout: 40000
  live_source: 1
  drop_pipeline_eos: 1

dot-stream-count: 0

multiurisrcbin:
  port: 9001
  live-source: 1
  width: 1920
  height: 1080
  batched-push-timeout: 40000
  max-batch-size: 6
  disable-passthrough: 0
  drop-pipeline-eos: 1

demux:
  max-pads: 1

source-transform:
  enable: 1
  # Resolution — 0 means pass through (use source native resolution)
  width: 1920
  height: 1080
  # Image format: RGBA, NV12, I420, BGRx, GRAY8 (empty = pass through)
  format: NV12
  # nvvideoconvert hardware: 0=default, 1=GPU, 2=VIC (Jetson only)
  compute-hw: 1
  gpu-id: 0
  # FPS control — 0 means no videorate injection
  target-fps: 15
  drop-only: 1          # 1 = only drop frames (never duplicate/interpolate)
  max-rate: 0           # Max output rate, 0 = same as target-fps
 

branch-streammux:
  width: 1920
  height: 1080
  batched-push-timeout: 40000
  batch-size: 1
  num-surfaces-per-frame: 1

primary-gie:
  unique-id: 1
  enable: 0
  plugin-type: 1
  config-file-path: /workspace/configs/nvinferserver/grpc/nvinferserver_primary_yolo11s.txt
  batch-size: 2
  interval: 0

secondary-gie0:
  unique-id: 2
  enable: 0
  plugin-type: 1
  config-file-path: /workspace/configs/nvinferserver/grpc/nvinferserver_primary_ppe.txt
  batch-size: 2
  operate-on-gie-id: 1        # ← manager patches the .txt automatically
  operate-on-class-ids: 0

encoder:
  enable: 0
  codec: 1

sink:
  enable: 1
  type: 0
  output-file: "/workspace/test-media/p2_output_fixed_v2.mkv"
  sync: 0
  framerate: "24/1"
  qos: 0
  rtsp-port: 8555
  udp-port: 5400
